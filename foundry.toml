[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.6.10"
evm_version = "istanbul"
optimizer = true
optimizer_runs = 200
# FISCO BCOS 2.1+ permits 256 KiB of deployed contract code.
# https://fisco-bcos-documentation.readthedocs.io/zh-cn/latest/docs/change_log/2_1_0.html
code_size_limit = 262144
# Keep the original Foundry examples without compiling them into this project.
skip = ["src/Counter.sol", "test/Counter.t.sol", "script/Counter.s.sol"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
